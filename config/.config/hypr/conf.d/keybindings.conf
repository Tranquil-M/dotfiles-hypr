###################
### KEYBINDINGS ###
###################

# Variables
$mainMod = SUPER # Sets "Windows" key as main modifier
$ipc = qs -c noctalia-shell ipc call

# Core
bind = $mainMod, SPACE, exec, $ipc launcher toggle
bind = $mainMod, C, exec, $ipc controlCenter toggle
bind = $mainMod, S, exec, $ipc settings toggle
bind = $mainMod, M, exec, $ipc media toggle
bind = $mainMod, N, exec, $ipc notifications toggleHistory
bind = $mainMod, X, exec, $ipc launcher emoji
bind = $mainMod, V, exec, $ipc launcher clipboard
bind = $mainMod, B, exec, $ipc battery togglePanel
bind = ALT, Tab, exec, $ipc launcher windows

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease
bindl = , XF86AudioNext, exec, $ipc media next
bindl = , XF86AudioPlay, exec, $ipc media playPause
bindl = , XF86AudioPrev, exec, $ipc media previous

# System Controls
bind = $mainMod, A, exec, $ipc bar toggle

# Applications
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod, E, exec, $ipc wallpaper toggle

# Screenshot Utilities
bind = $mainMod, Z, exec, ~/.config/hypr/conf.d/scripts/screenshot_region.sh
bind = $mainMod SHIFT, Z, exec, ~/.config/hypr/conf.d/scripts/screenshot_screen.sh

# Window Management
bind = $mainMod, W, killactive,
bind = $mainMod, T, togglefloating,
bind = $mainMod, T, exec, ~/.config/hypr/conf.d/scripts/is_floating.sh 
bind = $mainMod, backspace, exec, $ipc sessionMenu toggle
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT, F, fullscreen, 0

# Notifications
bind = $mainMod, comma, exec, $ipc notifications removeOldestHistory
bind = $mainMod SHIFT, comma, exec, $ipc notifications clear

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows in a direction
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop Specific
bindl=,switch:on:Lid Switch, exec, $ipc lockScreen lock & systemctl suspend
